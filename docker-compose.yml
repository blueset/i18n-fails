version: '3'

services:
  payload:
    image: ghcr.io/blueset/i18n-fails:master
    restart: unless-stopped
    ports:
      - '41863:3000'
    volumes:
      - ./public/media:/app/public/media
    depends_on:
      - mongo
    env_file:
      - .env
    networks:
      - app-network

  mongo:
    image: mongo:8.3
    restart: unless-stopped
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data:
